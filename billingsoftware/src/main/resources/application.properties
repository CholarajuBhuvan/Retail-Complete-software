spring.application.name=billingsoftware
server.port=8082

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:billingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Flyway temporarily disabled for initial setup
spring.flyway.enabled=false

# Tax configuration (dev)
app.tax.percent=10

# Allow circular references temporarily
spring.main.allow-circular-references=true

# Use the legacy Ant path matcher so Ant-style patterns with ** followed by more data work (SPA fallback routes)
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
