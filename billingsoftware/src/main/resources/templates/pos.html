<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content}, 'pos', 'Point of Sale')}">
<body>
<div th:fragment="content">
    <h1 class="text-3xl font-bold mb-6 text-gray-800">Point of Sale</h1>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Products Section -->
        <div class="lg:col-span-2">
            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-xl font-bold mb-4">Products</h2>
                
                <!-- Search -->
                <div class="mb-4 flex gap-2">
                    <input type="text" id="searchQuery" placeholder="Search products by name or SKU..." 
                           class="flex-1 px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button onclick="searchProducts()" 
                            class="px-6 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
                        Search
                    </button>
                    <button onclick="clearSearch()" 
                            class="px-6 py-2 bg-gray-600 text-white rounded-md hover:bg-gray-700">
                        Clear
                    </button>
                </div>

                <!-- Product Grid -->
                <div id="productGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4 max-h-96 overflow-y-auto">
                    <div class="text-center py-8 col-span-full">
                        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto"></div>
                        <p class="mt-4 text-gray-600">Loading products...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Cart Section -->
        <div class="lg:col-span-1">
            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-xl font-bold mb-4">Cart</h2>

                <!-- Customer Phone -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Customer Phone (Optional)</label>
                    <input type="text" id="customerPhone" placeholder="Enter phone number" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- Cart Items -->
                <div id="cartItems" class="mb-4 max-h-64 overflow-y-auto">
                    <p class="text-gray-500 text-center py-8">Cart is empty</p>
                </div>

                <!-- Totals -->
                <div id="cartTotals" class="border-t pt-4 mb-4" style="display: none;">
                    <div class="flex justify-between mb-2">
                        <span class="text-gray-600">Subtotal:</span>
                        <span id="subtotal" class="font-medium">₹0.00</span>
                    </div>
                    <div class="flex justify-between mb-2">
                        <span class="text-gray-600">Tax (10%):</span>
                        <span id="tax" class="font-medium">₹0.00</span>
                    </div>
                    <div class="flex justify-between text-lg font-bold">
                        <span>Total:</span>
                        <span id="total" class="text-green-600">₹0.00</span>
                    </div>
                </div>

                <!-- Actions -->
                <div class="space-y-2">
                    <button onclick="checkout()" id="checkoutBtn" disabled 
                            class="w-full px-4 py-3 bg-green-600 text-white rounded-md hover:bg-green-700 disabled:bg-gray-400 disabled:cursor-not-allowed font-semibold">
                        Complete Sale
                    </button>
                    <button onclick="clearCart()" id="clearBtn" disabled 
                            class="w-full px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700 disabled:bg-gray-400 disabled:cursor-not-allowed">
                        Clear Cart
                    </button>
                </div>

                <!-- Message -->
                <div id="message" class="mt-4" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script>
        let cart = [];
        let products = [];

        $(document).ready(function() {
            loadProducts();
            $('#searchQuery').on('keypress', function(e) {
                if (e.which === 13) searchProducts();
            });
        });

        function loadProducts(query = '') {
            const url = query ? '/api/products?q=' + encodeURIComponent(query) : '/api/products';
            $.get(url).done(function(data) {
                products = data;
                renderProducts();
            }).fail(function() {
                $('#productGrid').html('<div class="col-span-full bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">Error loading products</div>');
            });
        }

        function renderProducts() {
            let html = '';
            products.forEach(function(product) {
                html += '<div class="border border-gray-200 rounded-lg p-4 hover:shadow-md transition">';
                html += '<h3 class="font-semibold text-gray-900">' + product.name + '</h3>';
                html += '<p class="text-sm text-gray-600">SKU: ' + product.sku + '</p>';
                html += '<p class="text-lg font-bold text-green-600 mt-2">₹' + parseFloat(product.price).toFixed(2) + '</p>';
                html += '<p class="text-xs text-gray-500">Stock: ' + product.stockQuantity + '</p>';
                if (product.stockQuantity > 0) {
                    html += '<button onclick="addToCart(' + product.id + ')" class="mt-3 w-full px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">Add to Cart</button>';
                } else {
                    html += '<button disabled class="mt-3 w-full px-4 py-2 bg-gray-400 text-white rounded-md cursor-not-allowed">Out of Stock</button>';
                }
                html += '</div>';
            });
            $('#productGrid').html(html || '<p class="col-span-full text-center text-gray-500 py-8">No products found</p>');
        }

        function searchProducts() {
            loadProducts($('#searchQuery').val());
        }

        function clearSearch() {
            $('#searchQuery').val('');
            loadProducts();
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;

            const existing = cart.find(item => item.id === productId);
            if (existing) {
                if (existing.quantity < product.stockQuantity) {
                    existing.quantity++;
                }
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            renderCart();
        }

        function updateQuantity(productId, delta) {
            const item = cart.find(i => i.id === productId);
            if (!item) return;
            
            item.quantity += delta;
            if (item.quantity <= 0) {
                cart = cart.filter(i => i.id !== productId);
            } else if (item.quantity > item.stockQuantity) {
                item.quantity = item.stockQuantity;
            }
            renderCart();
        }

        function removeFromCart(productId) {
            cart = cart.filter(i => i.id !== productId);
            renderCart();
        }

        function renderCart() {
            if (cart.length === 0) {
                $('#cartItems').html('<p class="text-gray-500 text-center py-8">Cart is empty</p>');
                $('#cartTotals').hide();
                $('#checkoutBtn, #clearBtn').prop('disabled', true);
                return;
            }

            let html = '';
            cart.forEach(function(item) {
                html += '<div class="flex items-center justify-between mb-3 pb-3 border-b">';
                html += '<div class="flex-1">';
                html += '<p class="font-medium text-sm">' + item.name + '</p>';
                html += '<p class="text-xs text-gray-600">₹' + parseFloat(item.price).toFixed(2) + ' each</p>';
                html += '</div>';
                html += '<div class="flex items-center gap-2">';
                html += '<button onclick="updateQuantity(' + item.id + ', -1)" class="w-8 h-8 bg-gray-200 rounded hover:bg-gray-300">-</button>';
                html += '<span class="w-12 text-center font-medium">' + item.quantity + '</span>';
                html += '<button onclick="updateQuantity(' + item.id + ', 1)" class="w-8 h-8 bg-gray-200 rounded hover:bg-gray-300">+</button>';
                html += '<button onclick="removeFromCart(' + item.id + ')" class="ml-2 text-red-600 hover:text-red-800 text-xl">×</button>';
                html += '</div>';
                html += '</div>';
            });
            $('#cartItems').html(html);

            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const tax = subtotal * 0.10;
            const total = subtotal + tax;

            $('#subtotal').text('₹' + subtotal.toFixed(2));
            $('#tax').text('₹' + tax.toFixed(2));
            $('#total').text('₹' + total.toFixed(2));
            $('#cartTotals').show();
            $('#checkoutBtn, #clearBtn').prop('disabled', false);
        }

        function clearCart() {
            cart = [];
            renderCart();
        }

        function checkout() {
            if (cart.length === 0) return;

            $('#checkoutBtn').prop('disabled', true).text('Processing...');
            $('#message').hide();

            const customerPhone = $('#customerPhone').val();
            let customerId = 1;

            const processOrder = function(cid) {
                const orderData = {
                    customerId: cid,
                    items: cart.map(item => ({ productId: item.id, quantity: item.quantity }))
                };

                $.ajax({
                    url: '/api/orders',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(orderData)
                }).done(function(order) {
                    $('#message').html('<div class="p-3 rounded bg-green-100 text-green-800"><p class="text-sm">Order #' + order.id + ' created successfully! Total: ₹' + parseFloat(order.total).toFixed(2) + '</p><a href="/api/receipts/' + order.id + '.pdf" target="_blank" class="text-sm underline mt-2 inline-block">Download Receipt</a></div>').show();
                    cart = [];
                    $('#customerPhone').val('');
                    renderCart();
                    loadProducts();
                }).fail(function() {
                    $('#message').html('<div class="p-3 rounded bg-red-100 text-red-800"><p class="text-sm">Checkout failed. Please try again.</p></div>').show();
                }).always(function() {
                    $('#checkoutBtn').prop('disabled', false).text('Complete Sale');
                });
            };

            if (customerPhone) {
                $.get('/api/customers?q=' + encodeURIComponent(customerPhone)).done(function(customers) {
                    let customer = customers.find(c => c.phone === customerPhone);
                    if (customer) {
                        processOrder(customer.id);
                    } else {
                        $.ajax({
                            url: '/api/customers',
                            method: 'POST',
                            contentType: 'application/json',
                            data: JSON.stringify({ name: customerPhone, phone: customerPhone })
                        }).done(function(newCustomer) {
                            processOrder(newCustomer.id);
                        }).fail(function() {
                            processOrder(1);
                        });
                    }
                }).fail(function() {
                    processOrder(1);
                });
            } else {
                processOrder(1);
            }
        }
    </script>
</div>
</body>
</html>
