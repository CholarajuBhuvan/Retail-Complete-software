<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content}, 'users', 'User Management')}">
<body>
<div th:fragment="content">
    <h1 class="text-3xl font-bold mb-6 text-gray-800">User Management</h1>
    
    <!-- Create New User Section -->
    <div class="bg-white rounded-lg shadow p-6 mb-6">
        <h2 class="text-xl font-bold mb-4">Create New User</h2>
        <form id="createUserForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Username *</label>
                <input type="text" id="username" name="username" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Full Name *</label>
                <input type="text" id="fullName" name="fullName" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Email *</label>
                <input type="email" id="email" name="email" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Phone</label>
                <input type="tel" id="phone" name="phone"
                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Password *</label>
                <input type="password" id="password" name="password" required minlength="6"
                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Role *</label>
                <select id="role" name="role" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                    <option value="">Select Role</option>
                    <option value="ADMIN">Admin</option>
                    <option value="CASHIER">Cashier</option>
                </select>
            </div>
            <div class="md:col-span-2">
                <button type="submit" 
                        class="px-6 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 font-medium">
                    Create User
                </button>
            </div>
        </form>
        <div id="createUserMessage" class="mt-4"></div>
    </div>

    <!-- Users List Section -->
    <div class="bg-white rounded-lg shadow p-6">
        <h2 class="text-xl font-bold mb-4">All Users</h2>
        <div id="usersList" class="overflow-x-auto">
            <p class="text-gray-500">Loading users...</p>
        </div>
    </div>

    <script>
        const token = $("meta[name='_csrf']").attr("content");
        const header = $("meta[name='_csrf_header']").attr("content");

        // Load users on page load
        $(document).ready(function() {
            loadUsers();
        });

        // Create user form submission
        $('#createUserForm').on('submit', function(e) {
            e.preventDefault();
            
            const userData = {
                username: $('#username').val(),
                fullName: $('#fullName').val(),
                email: $('#email').val(),
                phone: $('#phone').val() || null,
                password: $('#password').val(),
                role: $('#role').val()
            };

            $.ajax({
                url: '/api/users',
                type: 'POST',
                contentType: 'application/json',
                headers: {
                    [header]: token
                },
                data: JSON.stringify(userData),
                success: function(response) {
                    $('#createUserMessage').html(
                        '<div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded">' +
                        'User created successfully!' +
                        '</div>'
                    );
                    $('#createUserForm')[0].reset();
                    loadUsers();
                    setTimeout(() => $('#createUserMessage').html(''), 3000);
                },
                error: function(xhr) {
                    let errorMsg = 'Error creating user';
                    if (xhr.responseJSON && xhr.responseJSON.message) {
                        errorMsg = xhr.responseJSON.message;
                    }
                    $('#createUserMessage').html(
                        '<div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">' +
                        errorMsg +
                        '</div>'
                    );
                }
            });
        });

        function loadUsers() {
            $.get('/api/users').done(function(users) {
                let html = '<table class="min-w-full divide-y divide-gray-200">';
                html += '<thead class="bg-gray-50">';
                html += '<tr>';
                html += '<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Username</th>';
                html += '<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Full Name</th>';
                html += '<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Email</th>';
                html += '<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Role</th>';
                html += '<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>';
                html += '<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>';
                html += '</tr>';
                html += '</thead>';
                html += '<tbody class="bg-white divide-y divide-gray-200">';
                
                users.forEach(function(user) {
                    html += '<tr>';
                    html += '<td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">' + user.username + '</td>';
                    html += '<td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">' + user.fullName + '</td>';
                    html += '<td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">' + user.email + '</td>';
                    html += '<td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">' + user.role + '</td>';
                    html += '<td class="px-6 py-4 whitespace-nowrap">';
                    if (user.enabled) {
                        html += '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">Active</span>';
                    } else {
                        html += '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-red-100 text-red-800">Disabled</span>';
                    }
                    html += '</td>';
                    html += '<td class="px-6 py-4 whitespace-nowrap text-sm">';
                    if (!user.enabled) {
                        html += '<button onclick="toggleUserStatus(' + user.id + ', true)" class="text-green-600 hover:text-green-900 mr-3">Enable</button>';
                    } else {
                        html += '<button onclick="toggleUserStatus(' + user.id + ', false)" class="text-yellow-600 hover:text-yellow-900 mr-3">Disable</button>';
                    }
                    html += '<button onclick="resetPassword(' + user.id + ')" class="text-blue-600 hover:text-blue-900">Reset Password</button>';
                    html += '</td>';
                    html += '</tr>';
                });
                
                html += '</tbody>';
                html += '</table>';
                
                if (users.length === 0) {
                    html = '<p class="text-gray-500">No users found</p>';
                }
                
                $('#usersList').html(html);
            }).fail(function() {
                $('#usersList').html('<p class="text-red-600">Error loading users</p>');
            });
        }

        function toggleUserStatus(userId, enable) {
            const action = enable ? 'enable' : 'disable';
            if (!confirm('Are you sure you want to ' + action + ' this user?')) {
                return;
            }

            $.ajax({
                url: '/api/users/' + userId,
                type: 'PUT',
                contentType: 'application/json',
                headers: {
                    [header]: token
                },
                data: JSON.stringify({ enabled: enable }),
                success: function() {
                    loadUsers();
                },
                error: function(xhr) {
                    alert('Error updating user status');
                }
            });
        }

        function resetPassword(userId) {
            const newPassword = prompt('Enter new password (min 6 characters):');
            if (!newPassword || newPassword.length < 6) {
                alert('Password must be at least 6 characters');
                return;
            }

            $.ajax({
                url: '/api/users/' + userId + '/password',
                type: 'PUT',
                contentType: 'application/json',
                headers: {
                    [header]: token
                },
                data: JSON.stringify({ password: newPassword }),
                success: function() {
                    alert('Password reset successfully');
                },
                error: function(xhr) {
                    alert('Error resetting password');
                }
            });
        }
    </script>
</div>
</body>
</html>
