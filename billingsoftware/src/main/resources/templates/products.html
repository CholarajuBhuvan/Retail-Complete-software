<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content}, 'products', 'Products')}">
<body>
<div th:fragment="content">
    <h1 class="text-3xl font-bold mb-6 text-gray-800">Products</h1>
    
    <!-- Add Product Form -->
    <div class="bg-white rounded-lg shadow p-6 mb-6">
        <h2 class="text-xl font-bold mb-4">Add New Product</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Product Name *</label>
                <input type="text" id="productName" class="w-full px-4 py-2 border border-gray-300 rounded-md" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">SKU *</label>
                <input type="text" id="productSku" class="w-full px-4 py-2 border border-gray-300 rounded-md" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Price (₹) *</label>
                <input type="number" id="productPrice" step="0.01" class="w-full px-4 py-2 border border-gray-300 rounded-md" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Cost Price (₹)</label>
                <input type="number" id="productCostPrice" step="0.01" class="w-full px-4 py-2 border border-gray-300 rounded-md">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Stock Quantity *</label>
                <input type="number" id="productStock" class="w-full px-4 py-2 border border-gray-300 rounded-md" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Barcode</label>
                <input type="text" id="productBarcode" class="w-full px-4 py-2 border border-gray-300 rounded-md">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Unit</label>
                <input type="text" id="productUnit" placeholder="pcs, kg, ltr" class="w-full px-4 py-2 border border-gray-300 rounded-md">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Min Stock Level</label>
                <input type="number" id="productMinStock" class="w-full px-4 py-2 border border-gray-300 rounded-md">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Max Stock Level</label>
                <input type="number" id="productMaxStock" class="w-full px-4 py-2 border border-gray-300 rounded-md">
            </div>
        </div>
        <div class="mt-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
            <textarea id="productDescription" rows="2" class="w-full px-4 py-2 border border-gray-300 rounded-md"></textarea>
        </div>
        <div class="mt-4 flex gap-2">
            <button onclick="addProduct()" class="px-6 py-2 bg-green-600 text-white rounded-md hover:bg-green-700">Add Product</button>
            <button onclick="clearForm()" class="px-6 py-2 bg-gray-600 text-white rounded-md hover:bg-gray-700">Clear Form</button>
        </div>
        <div id="addMessage" class="mt-4 hidden"></div>
    </div>
    
    <div class="bg-white rounded-lg shadow p-6">
        <h2 class="text-xl font-bold mb-4">Product List</h2>
        <div class="mb-4 flex gap-2">
            <input type="text" id="searchQuery" placeholder="Search products..." 
                   class="flex-1 px-4 py-2 border border-gray-300 rounded-md">
            <button onclick="searchProducts()" class="px-6 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">Search</button>
        </div>
        
        <div id="productList" class="overflow-x-auto">
            <div class="text-center py-8">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto"></div>
                <p class="mt-4 text-gray-600">Loading products...</p>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            loadProducts();
        });

        function loadProducts(query = '') {
            const url = query ? '/api/products?q=' + encodeURIComponent(query) : '/api/products';
            $.get(url).done(function(products) {
                let html = '<table class="min-w-full divide-y divide-gray-200">';
                html += '<thead class="bg-gray-50"><tr>';
                html += '<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Name</th>';
                html += '<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">SKU</th>';
                html += '<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Price</th>';
                html += '<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Stock</th>';
                html += '<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>';
                html += '<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>';
                html += '</tr></thead><tbody class="bg-white divide-y divide-gray-200">';
                
                products.forEach(function(p) {
                    html += '<tr id="row-' + p.id + '">';
                    html += '<td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">' + p.name + '</td>';
                    html += '<td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">' + p.sku + '</td>';
                    html += '<td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">₹' + parseFloat(p.price).toFixed(2) + '</td>';
                    html += '<td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">' + p.stockQuantity + '</td>';
                    html += '<td class="px-6 py-4 whitespace-nowrap"><span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ' + (p.status === 'ACTIVE' ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-800') + '">' + p.status + '</span></td>';
                    html += '<td class="px-6 py-4 whitespace-nowrap text-sm">';
                    html += '<button onclick="editProduct(' + p.id + ')" class="text-blue-600 hover:text-blue-900 mr-3">Edit</button>';
                    html += '<button onclick="deleteProduct(' + p.id + ')" class="text-red-600 hover:text-red-900">Delete</button>';
                    html += '</td>';
                    html += '</tr>';
                });
                
                html += '</tbody></table>';
                $('#productList').html(html);
            });
        }

        function searchProducts() {
            loadProducts($('#searchQuery').val());
        }

        function clearForm() {
            $('#productName, #productSku, #productPrice, #productCostPrice, #productStock, #productBarcode, #productUnit, #productMinStock, #productMaxStock, #productDescription').val('');
            $('#addMessage').hide();
        }

        function addProduct() {
            const name = $('#productName').val().trim();
            const sku = $('#productSku').val().trim();
            const price = parseFloat($('#productPrice').val());
            const stock = parseInt($('#productStock').val());

            if (!name || !sku || isNaN(price) || isNaN(stock)) {
                $('#addMessage').html('<div class="p-3 rounded bg-red-100 text-red-800">Please fill all required fields</div>').removeClass('hidden');
                return;
            }

            const product = {
                name: name,
                sku: sku,
                price: price,
                stockQuantity: stock,
                costPrice: parseFloat($('#productCostPrice').val()) || null,
                barcode: $('#productBarcode').val().trim() || null,
                unit: $('#productUnit').val().trim() || 'pcs',
                minStockLevel: parseInt($('#productMinStock').val()) || null,
                maxStockLevel: parseInt($('#productMaxStock').val()) || null,
                description: $('#productDescription').val().trim() || null,
                status: 'ACTIVE',
                trackStock: true,
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString()
            };

            $.ajax({
                url: '/api/products',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(product),
                headers: {
                    'X-CSRF-TOKEN': $('meta[name="_csrf"]').attr('content')
                }
            }).done(function(savedProduct) {
                $('#addMessage').html('<div class="p-3 rounded bg-green-100 text-green-800">Product added successfully!</div>').removeClass('hidden');
                clearForm();
                loadProducts();
            }).fail(function(xhr) {
                let errorMsg = 'Failed to add product';
                if (xhr.status === 409) {
                    errorMsg = 'Product with this SKU already exists';
                }
                $('#addMessage').html('<div class="p-3 rounded bg-red-100 text-red-800">' + errorMsg + '</div>').removeClass('hidden');
            });
        }

        function editProduct(id) {
            $.get('/api/products/' + id).done(function(product) {
                $('#productName').val(product.name);
                $('#productSku').val(product.sku);
                $('#productPrice').val(product.price);
                $('#productCostPrice').val(product.costPrice || '');
                $('#productStock').val(product.stockQuantity);
                $('#productBarcode').val(product.barcode || '');
                $('#productUnit').val(product.unit || '');
                $('#productMinStock').val(product.minStockLevel || '');
                $('#productMaxStock').val(product.maxStockLevel || '');
                $('#productDescription').val(product.description || '');
                
                $('html, body').animate({ scrollTop: 0 }, 500);
                $('#addMessage').html('<div class="p-3 rounded bg-blue-100 text-blue-800">Editing: ' + product.name + ' <button onclick="updateProduct(' + id + ')" class="ml-2 px-3 py-1 bg-blue-600 text-white rounded">Update</button> <button onclick="clearForm()" class="ml-2 px-3 py-1 bg-gray-600 text-white rounded">Cancel</button></div>').removeClass('hidden');
            });
        }

        function updateProduct(id) {
            const product = {
                name: $('#productName').val().trim(),
                sku: $('#productSku').val().trim(),
                price: parseFloat($('#productPrice').val()),
                stockQuantity: parseInt($('#productStock').val()),
                costPrice: parseFloat($('#productCostPrice').val()) || null,
                barcode: $('#productBarcode').val().trim() || null,
                unit: $('#productUnit').val().trim() || 'pcs',
                minStockLevel: parseInt($('#productMinStock').val()) || null,
                maxStockLevel: parseInt($('#productMaxStock').val()) || null,
                description: $('#productDescription').val().trim() || null,
                updatedAt: new Date().toISOString()
            };

            $.ajax({
                url: '/api/products/' + id,
                method: 'PUT',
                contentType: 'application/json',
                data: JSON.stringify(product),
                headers: {
                    'X-CSRF-TOKEN': $('meta[name="_csrf"]').attr('content')
                }
            }).done(function() {
                $('#addMessage').html('<div class="p-3 rounded bg-green-100 text-green-800">Product updated successfully!</div>').removeClass('hidden');
                clearForm();
                loadProducts();
            }).fail(function() {
                $('#addMessage').html('<div class="p-3 rounded bg-red-100 text-red-800">Failed to update product</div>').removeClass('hidden');
            });
        }

        function deleteProduct(id) {
            if (!confirm('Are you sure you want to delete this product?')) return;

            $.ajax({
                url: '/api/products/' + id,
                method: 'DELETE',
                headers: {
                    'X-CSRF-TOKEN': $('meta[name="_csrf"]').attr('content')
                }
            }).done(function() {
                $('#row-' + id).fadeOut(function() {
                    $(this).remove();
                });
            }).fail(function() {
                alert('Failed to delete product');
            });
        }
    </script>
</div>
</body>
</html>
